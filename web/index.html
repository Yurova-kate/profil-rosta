<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Профиль роста</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#192638;background:#f4f6fa}*{box-sizing:border-box}
body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;background:#315ce8;color:white;padding:11px 15px;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;border:1px solid #d6dce8;border-radius:9px;padding:11px;background:white;color:#172339}textarea{min-height:90px}
label{display:block;font-size:13px;color:#536174;margin:12px 0 5px}.shell{max-width:1160px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:23px;font-weight:800}.muted{color:#66748a}.grid{display:grid;grid-template-columns:260px 1fr;gap:20px;margin-top:22px}
.card{background:white;border:1px solid #e3e8f1;border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 4px 16px #1c315008}.nav button{display:block;text-align:left;width:100%;margin:7px 0;background:#eef2ff;color:#2442a4}.nav button.active{background:#315ce8;color:white}
.row{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.item{padding:13px 0;border-bottom:1px solid #edf0f5}.item:last-child{border:0}.tag{font-size:12px;background:#e9f7ef;color:#187448;padding:5px 9px;border-radius:20px}.tag.pending{background:#fff4df;color:#906014}
.error{color:#a52232}.notice{background:#edf3ff;border-radius:10px;padding:12px;margin:14px 0}.auth{max-width:460px;margin:8vh auto}.ghost{background:#eef2ff;color:#3154bc}h1{font-size:27px}h2{font-size:19px;margin-top:0}h3{font-size:16px}form button{margin-top:14px}.small{font-size:13px}@media(max-width:720px){.grid{grid-template-columns:1fr}.shell{padding:14px}.top{align-items:flex-start}.card{padding:16px}}

.grid>section,.card,.item{min-width:0;overflow-wrap:anywhere}.nav{align-self:start;position:sticky;top:12px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #86a5ff;outline-offset:2px}button{min-height:44px}details summary{cursor:pointer;padding:10px 0}@media(max-width:720px){.nav{position:static;display:flex;gap:8px;overflow-x:auto;padding:10px}.nav button{flex:0 0 auto;width:auto;white-space:nowrap;margin:0}.nav p{display:none}.grid{display:block}}
</style></head><body><div id="app"></div>
<script src="/development.js"></script><script>
const root=document.getElementById('app');let token=sessionStorage.getItem('profile_token')||'';let me=null;let selected=null;let section='profile';let users=[];let profile=null;let catalog=[];let competencyCatalog=[];let competencies=[];let developmentGoals=[];let competencySearch='';let competencyCategory='';let flash='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,{method='GET',body}={}){const r=await fetch('/api'+path,{method,headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){let d;try{d=await r.json()}catch{}throw Error(typeof d?.detail==='string'?d.detail:'Ошибка запроса: '+r.status)}return r}
async function json(path,options){return (await api(path,options)).json()}
function alertMessage(text,error=false){flash=(error?'Ошибка: ':'')+text;render()}
function authView(){root.innerHTML='<main class="shell auth"><div class="brand">◈ Профиль роста</div><p class="muted">Профессиональный опыт и компетенции в одном месте</p><div class="card"><h2>Вход</h2><form id="login"><label>Email</label><input name="email" type="email" required autocomplete="username"><label>Пароль</label><input name="password" type="password" required autocomplete="current-password"><button>Войти</button></form><p class="small muted">Первый запуск? Создайте администратора ниже. Только для локального демонстрационного окружения.</p><details><summary>Первоначальная настройка</summary><form id="bootstrap"><label>Имя</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Пароль (не менее 10 символов)</label><input name="password" type="password" minlength="10" required><button>Создать администратора</button></form></details></div><p id="error" class="error"></p></main>';
document.getElementById('login').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{const a=await json('/login',{method:'POST',body:d});token=a.token;sessionStorage.setItem('profile_token',token);await load()}catch(err){document.getElementById('error').textContent=err.message}};
document.getElementById('bootstrap').onsubmit=async e=>{e.preventDefault();try{await json('/bootstrap',{method:'POST',body:Object.fromEntries(new FormData(e.target))});document.getElementById('error').textContent='Администратор создан. Теперь войдите.'}catch(err){document.getElementById('error').textContent=err.message}}}
async function load(){try{me=await json('/me');users=await json('/users');selected=selected&&users.some(u=>u.id===selected)?selected:me.id;profile=await json('/users/'+selected+'/profile');catalog=await json('/certifications/catalog');await loadCompetencies();await loadDevelopment();render()}catch(err){token='';sessionStorage.removeItem('profile_token');authView();document.getElementById('error').textContent=err.message}}
async function loadCompetencies(){competencyCatalog=await json('/competencies/catalog');competencies=await json('/users/'+selected+'/competencies')}
async function loadDevelopment(){developmentGoals=await json('/users/'+selected+'/development')}
function nav(){return '<aside class="card nav"><button data-section="profile" class="'+(section==='profile'?'active':'')+'">Профиль и компетенции</button><button data-section="competencies" class="'+(section==='competencies'?'active':'')+'">Компетенции 1С</button><button data-section="development" class="'+(section==='development'?'active':'')+'">План развития</button><button data-section="projects" class="'+(section==='projects'?'active':'')+'">Проектный опыт</button><button data-section="certifications" class="'+(section==='certifications'?'active':'')+'">Сертификации 1С</button>'+(me.role==='admin'?'<button data-section="users" class="'+(section==='users'?'active':'')+'">Пользователи</button>':'')+'<p class="small muted">Другие модули появятся после реализации сквозных сценариев.</p></aside>'}
function userSelect(){return '<label>Профиль сотрудника</label><select id="person">'+users.map(u=>'<option value="'+u.id+'" '+(u.id===selected?'selected':'')+'>'+esc(u.name)+' — '+esc(u.role)+'</option>').join('')+'</select>'}
function profileView(){const canEdit=me.role==='admin'||me.id===selected;const d=profile.details||{};
return '<div class="card"><div class="row"><div><h2>'+esc(profile.employee.name)+'</h2><p class="muted">'+esc(profile.employee.email)+'</p></div><button id="resume">Скачать резюме DOCX</button></div></div><div class="card"><h2>Профессиональный профиль</h2>'+(canEdit?'<form id="details"><label>Должность</label><input name="job_title" maxlength="160" value="'+esc(d.job_title||'')+'" placeholder="Например, аналитик 1С"><label>Специализация</label><input name="specialization" maxlength="160" value="'+esc(d.specialization||'')+'" placeholder="Например, 1С:ЗУП"><label>Грейд</label><input name="grade" maxlength="80" value="'+esc(d.grade||'')+'" placeholder="Например, Middle"><label>Опыт работы, лет</label><input name="years_experience" type="number" min="0" max="70" value="'+esc(d.years_experience??'')+'"><label>О себе и профессиональные результаты</label><textarea name="about" maxlength="3000">'+esc(d.about||'')+'</textarea><button>Сохранить профиль</button></form>':'<div class="item"><strong>Должность:</strong> '+esc(d.job_title||'Не указана')+'</div><div class="item"><strong>Специализация:</strong> '+esc(d.specialization||'Не указана')+'</div><div class="item"><strong>Грейд:</strong> '+esc(d.grade||'Не указан')+'</div><div class="item"><strong>Опыт:</strong> '+esc(d.years_experience??'Не указан')+'</div><p>'+esc(d.about||'')+'</p>')+'</div><div class="card"><h2>Компетенции</h2><p class="muted">Навыки выбираются из общего справочника.</p><button type="button" id="goCompetencies" class="ghost">Открыть справочник</button></div>'}
function competenciesView(){const editable=me.role==='admin'||me.id===selected;const labels={beginner:'Начальный',intermediate:'Рабочий',advanced:'Продвинутый',expert:'Экспертный'};const categories=[...new Set(competencyCatalog.map(x=>x.category))].sort();const filtered=competencyCatalog.filter(x=>(!competencyCategory||x.category===competencyCategory)&&(!competencySearch||(x.name+' '+x.category+' '+x.description).toLowerCase().includes(competencySearch.toLowerCase())));return '<div class="card"><h2>Компетенции 1С</h2><p class="muted">Единый каталог компании. Уровень компетенции не равен грейду сотрудника.</p>'+(competencies.length?competencies.map(c=>'<div class="item"><div class="row"><div><strong>'+esc(c.name)+'</strong><p class="small muted">'+esc(c.category)+' · '+esc(labels[c.level])+'</p></div><div class="row">'+(editable?'<button class="ghost" data-competency-delete="'+c.id+'">Удалить</button>':'')+'</div></div>'+(editable?'<form data-competency-edit="'+c.id+'"><label>Изменить уровень</label><select name="level">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'" '+(k===c.level?'selected':'')+'>'+v+'</option>').join('')+'</select><button class="ghost">Сохранить уровень</button></form>':'')+'</div>').join(''):'<p class="muted">Компетенции пока не добавлены.</p>')+(editable?'<div><label>Поиск по справочнику</label><input id="competencySearch" type="search" value="'+esc(competencySearch)+'" placeholder="Название или категория"><label>Категория</label><select id="competencyCategory"><option value="">Все категории</option>'+categories.map(cat=>'<option value="'+esc(cat)+'" '+(cat===competencyCategory?'selected':'')+'>'+esc(cat)+'</option>').join('')+'</select><p class="small muted">Найдено: '+filtered.length+'</p></div><form id="addCompetency"><h3>Добавить компетенцию</h3><label>Выберите из каталога</label><select name="competency_id" required><option value="">Выберите компетенцию</option>'+filtered.map(c=>'<option value="'+c.id+'">'+esc(c.category)+' · '+esc(c.name)+'</option>').join('')+'</select><label>Уровень</label><select name="level">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select><button '+(!competencyCatalog.length?'disabled':'')+'>Добавить</button></form>':'')+'</div>'+(me.role==='admin'?'<div class="card"><h2>Управление каталогом</h2><form id="catalogCompetency"><label>Название компетенции</label><input name="name" required minlength="2"><label>Категория</label><input name="category" required minlength="2"><label>Описание</label><textarea name="description"></textarea><button>Создать компетенцию</button></form></div>':'')+'<div class="card"><h2>Ранее добавленные навыки</h2><p class="muted">Сопоставьте каждый старый навык с компетенцией из каталога. Исходная запись останется в базе.</p>'+(profile.skills.length?profile.skills.map(s=>'<div class="item"><strong>'+esc(s.name)+'</strong>'+(editable?'<form data-map-legacy="'+s.id+'"><label>Соответствующая компетенция</label><select name="competency_id" required><option value="">Выберите</option>'+competencyCatalog.map(c=>'<option value="'+c.id+'">'+esc(c.category)+' · '+esc(c.name)+'</option>').join('')+'</select><label>Уровень</label><select name="level">'+Object.entries(labels).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select><button class="ghost">Сопоставить без удаления</button></form>':'')+'</div>').join(''):'<p class="muted">Нет записей.</p>')+'</div>'}
function projectsView(){const canEdit=me.role==='admin'||me.id===selected;return '<div class="card"><h2>Проектный опыт</h2>'+(profile.projects.length?profile.projects.map(p=>'<div class="item"><h3>'+esc(p.title)+'</h3><p>'+esc(p.description)+'</p></div>').join(''):'<p class="muted">Проектов пока нет.</p>')+(canEdit?'<form id="project"><label>Название проекта</label><input name="title" minlength="2" required><label>Вклад сотрудника и результаты</label><textarea name="description"></textarea><button>Добавить проект</button></form>':'')+'</div>'}
function certView(){const canEdit=me.role==='admin'||me.id===selected;return '<div class="card"><h2>Мои сертификаты 1С</h2><p class="muted">Выберите сертификацию из каталога, укажите номер и при наличии ссылку на паспорт сертификата. Запись добавляется сотрудником и пока не проверяется автоматически по данным 1С.</p>'+(profile.earned_certifications.length?profile.earned_certifications.map(c=>'<div class="item row"><div><strong>'+esc(c.exam_title)+'</strong><p class="small">Номер: '+esc(c.certificate_number)+'</p>'+(c.passport_url?'<a href="'+esc(c.passport_url)+'" target="_blank" rel="noopener noreferrer">Паспорт сертификата ↗</a>':'')+'</div>'+(canEdit?'<button class="ghost" data-delete-cert="'+c.id+'">Удалить</button>':'')+'</div>').join(''):'<p class="muted">Сертификаты пока не добавлены.</p>')+(canEdit?'<form id="earnedCert"><label>Сертификация из каталога</label><select name="certification_id" required><option value="">Выберите сертификацию</option>'+catalog.map(c=>'<option value="'+c.id+'">'+esc(c.exam_title)+'</option>').join('')+'</select><label>Номер сертификата</label><input name="certificate_number" maxlength="120" required><label>Ссылка на паспорт сертификата (необязательно)</label><input name="passport_url" type="url" placeholder="https://..." pattern="https://.*"><button '+(!catalog.length?'disabled title="Каталог пуст"':'')+'>Добавить сертификат</button></form>':'')+'</div><div class="card"><h2>Рекомендуемые сертификации</h2><p class="muted">Подбираются по навыкам. Рекомендация не означает наличие сертификата.</p>'+(profile.certifications.length?profile.certifications.map(c=>'<div class="item">'+esc(c.exam_title)+'</div>').join(''):'<p class="muted">Пока нет рекомендаций.</p>')+(me.role==='admin'?'<form id="cert"><h3>Добавить сертификацию в каталог</h3><label>Ключевое слово навыка</label><input name="skill_keyword" required><label>Название сертификации</label><input name="exam_title" required><button>Добавить в каталог</button></form>':'')+'</div>'}
function usersView(){return '<div class="card"><h2>Пользователи</h2>'+users.map(u=>'<div class="item">'+esc(u.name)+' · '+esc(u.email)+' · '+esc(u.role)+'</div>').join('')+'<form id="newUser"><h3>Добавить пользователя</h3><label>Имя</label><input name="name" required><label>Email</label><input name="email" type="email" required><label>Пароль (не менее 10 символов)</label><input name="password" type="password" minlength="10" required><label>Роль</label><select name="role"><option value="employee">Сотрудник</option><option value="manager">Руководитель</option><option value="admin">Администратор</option></select><label>Руководитель (необязательно)</label><select name="manager_id"><option value="">Не выбран</option>'+users.filter(u=>u.role==='manager').map(u=>'<option value="'+u.id+'">'+esc(u.name)+'</option>').join('')+'</select><button>Создать пользователя</button></form></div>'}
function render(){if(!me){authView();return}root.innerHTML='<main class="shell"><header class="top"><div><div class="brand">◈ Профиль роста</div><div class="muted small">Демонстрационная версия · '+esc(me.name)+'</div></div><button id="logout" class="ghost">Выйти</button></header>'+(flash?'<div class="notice" role="status">'+esc(flash)+'</div>':'')+'<div class="grid">'+nav()+'<section>'+(me.role!=='employee'?'<div class="card">'+userSelect()+'</div>':'')+(section==='profile'?profileView():section==='competencies'?competenciesView():section==='development'?developmentView():section==='projects'?projectsView():section==='certifications'?certView():usersView())+'</section></div></main>';
bindDevelopment();
document.getElementById('logout').onclick=()=>{token='';me=null;sessionStorage.removeItem('profile_token');authView()};
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;flash='';render()});
const person=document.getElementById('person');if(person)person.onchange=async()=>{const nextId=Number(person.value);person.disabled=true;try{const [nextProfile,nextCompetencies,nextGoals]=await Promise.all([json('/users/'+nextId+'/profile'),json('/users/'+nextId+'/competencies'),json('/users/'+nextId+'/development')]);selected=nextId;profile=nextProfile;competencies=nextCompetencies;developmentGoals=nextGoals;flash='';render()}catch(err){person.disabled=false;person.value=String(selected);alertMessage(err.message,true)}};
const go=document.getElementById('goCompetencies');if(go)go.onclick=()=>{section='competencies';render()};
const resume=document.getElementById('resume');if(resume)resume.onclick=async()=>{try{const r=await api('/users/'+selected+'/resume.docx');const url=URL.createObjectURL(await r.blob());const a=document.createElement('a');a.href=url;a.download='resume.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}catch(err){alertMessage(err.message,true)}};
const search=document.getElementById('competencySearch');if(search)search.oninput=()=>{competencySearch=search.value;const caret=search.selectionStart;render();const replacement=document.getElementById('competencySearch');if(replacement){replacement.focus();replacement.setSelectionRange(caret,caret)}};const category=document.getElementById('competencyCategory');if(category)category.onchange=()=>{competencyCategory=category.value;render()};
document.querySelectorAll('[data-map-legacy]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();try{await json('/users/'+selected+'/competencies/map-legacy',{method:'POST',body:{skill_id:Number(form.dataset.mapLegacy),competency_id:Number(form.elements.competency_id.value),level:form.elements.level.value}});await loadCompetencies();alertMessage('Навык сопоставлен. Исходная запись сохранена.')}catch(err){alertMessage(err.message,true)}});
document.querySelectorAll('[data-competency-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить компетенцию из профиля?'))return;try{await api('/users/'+selected+'/competencies/'+b.dataset.competencyDelete,{method:'DELETE'});await loadCompetencies();alertMessage('Компетенция удалена')}catch(e){alertMessage(e.message,true)}});
document.querySelectorAll('[data-competency-edit]').forEach(form=>form.onsubmit=async e=>{e.preventDefault();try{await json('/users/'+selected+'/competencies/'+form.dataset.competencyEdit,{method:'PUT',body:{level:form.elements.level.value}});await loadCompetencies();alertMessage('Уровень изменён')}catch(err){alertMessage(err.message,true)}});
for(const [id,path,convert] of [['addCompetency','/users/'+selected+'/competencies',x=>({...x,competency_id:Number(x.competency_id)})],['catalogCompetency','/competencies/catalog',x=>x]]){const form=document.getElementById(id);if(form)form.onsubmit=async e=>{e.preventDefault();try{await json(path,{method:'POST',body:convert(Object.fromEntries(new FormData(form)))});await loadCompetencies();alertMessage('Сохранено')}catch(err){alertMessage(err.message,true)}}}
document.querySelectorAll('[data-delete-cert]').forEach(b=>b.onclick=async()=>{if(!confirm('Удалить сертификат из профиля?'))return;try{await api('/users/'+selected+'/certifications/'+b.dataset.deleteCert,{method:'DELETE'});profile=await json('/users/'+selected+'/profile');alertMessage('Сертификат удалён')}catch(err){alertMessage(err.message,true)}});
for(const [id,path,convert] of [['details','/users/'+selected+'/profile',x=>({...x,years_experience:x.years_experience===''?null:Number(x.years_experience)})],['earnedCert','/users/'+selected+'/certifications',x=>({...x,certification_id:Number(x.certification_id),passport_url:x.passport_url||null})],['skill','/users/'+selected+'/skills',x=>x],['project','/users/'+selected+'/projects',x=>x],['cert','/certifications',x=>x],['newUser','/users',x=>({...x,manager_id:x.manager_id?Number(x.manager_id):null})]]){const form=document.getElementById(id);if(form)form.onsubmit=async e=>{e.preventDefault();try{await json(path,{method:id==='details'?'PUT':'POST',body:convert(Object.fromEntries(new FormData(form)))});users=await json('/users');profile=await json('/users/'+selected+'/profile');catalog=await json('/certifications/catalog');alertMessage('Сохранено')}catch(err){alertMessage(err.message,true)}}}
}
if(token)load();else authView();
</script></body></html>
